name: Android build & release

on:
  push:
    branches: [main, dev]
  workflow_dispatch:
    inputs:
      publish_release:
        description: "Publish a GitHub Release with the APK"
        type: boolean
        default: true

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    name: Assemble debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Consommees par le job `release`, qui ne recompile pas : il recupere l'APK
    # en artifact.
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      date: ${{ steps.version.outputs.date }}
      build_num: ${{ steps.version.outputs.build_num }}
      apk_name: ${{ steps.rename.outputs.apk_name }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Cache Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-home-cache-cleanup: true

      - name: Decode debug keystore
        env:
          KEYSTORE_B64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          mkdir -p app/keystore
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > app/keystore/debug.keystore
            echo "Using debug keystore from secret."
          else
            echo "No DEBUG_KEYSTORE_BASE64 secret set — falling back to AGP auto-generated keystore (signatures will differ per build)."
          fi

      - name: Grant execute permission to gradlew
        run: chmod +x ./gradlew || true

      - name: Ensure gradle wrapper exists
        run: |
          if [ ! -f "./gradlew" ]; then
            echo "Bootstrapping Gradle wrapper..."
            curl -sL https://services.gradle.org/distributions/gradle-8.11.1-bin.zip -o /tmp/gradle.zip
            unzip -q /tmp/gradle.zip -d /tmp/gradle
            /tmp/gradle/gradle-8.11.1/bin/gradle wrapper --gradle-version 8.11.1 --distribution-type bin
            chmod +x ./gradlew
          fi

      - name: Compute version tag
        id: version
        run: |
          SHORT_SHA=$(git rev-parse --short HEAD)
          DATE=$(date +'%Y.%m.%d')
          BUILD_NUM=${{ github.run_number }}
          TAG="v0.1.${BUILD_NUM}-${SHORT_SHA}"
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "short_sha=$SHORT_SHA" >> $GITHUB_OUTPUT
          echo "date=$DATE" >> $GITHUB_OUTPUT
          echo "build_num=$BUILD_NUM" >> $GITHUB_OUTPUT

      - name: Build debug APK
        env:
          DEBUG_KEYSTORE_PASSWORD: ${{ secrets.DEBUG_KEYSTORE_PASSWORD }}
          DEBUG_KEY_ALIAS: ${{ secrets.DEBUG_KEY_ALIAS }}
          DEBUG_KEY_PASSWORD: ${{ secrets.DEBUG_KEY_PASSWORD }}
          APP_VERSION_NAME: ${{ steps.version.outputs.tag }}
          APP_VERSION_CODE: ${{ steps.version.outputs.build_num }}
        run: ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - name: Rename APK
        id: rename
        run: |
          SRC=$(find app/build/outputs/apk/debug -name "*.apk" | head -n1)
          DEST="trackmyweight-${{ steps.version.outputs.tag }}.apk"
          mv "$SRC" "$DEST"
          echo "apk_path=$DEST" >> $GITHUB_OUTPUT
          echo "apk_name=$DEST" >> $GITHUB_OUTPUT
          echo "SHA256: $(sha256sum "$DEST" | cut -d' ' -f1)"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: apk-${{ steps.version.outputs.tag }}
          path: ${{ steps.rename.outputs.apk_path }}
          retention-days: 30

  unit-tests:
    name: JVM unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Ensure gradle wrapper exists
        run: |
          if [ ! -f "./gradlew" ]; then
            curl -sL https://services.gradle.org/distributions/gradle-8.11.1-bin.zip -o /tmp/gradle.zip
            unzip -q /tmp/gradle.zip -d /tmp/gradle
            /tmp/gradle/gradle-8.11.1/bin/gradle wrapper --gradle-version 8.11.1 --distribution-type bin
            chmod +x ./gradlew
          fi
      - name: Run JVM unit tests
        run: ./gradlew :app:testDebugUnitTest --no-daemon --stacktrace
      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports
          path: app/build/reports/tests/

  instrumented-tests:
    name: Instrumented tests (emulator)
    # Actif sur main uniquement pour ne pas bloquer les branches de dev.
    #
    # continue-on-error a ete retire : il datait de l'epoque ou le job echouait
    # une fois sur quatre sur une course au demarrage de l'emulateur. Depuis que
    # 46 des 53 tests sont passes sur la JVM (Robolectric) et que les 7 restants
    # tournent sur image ATD avec une seconde tentative, un echec merite d'etre
    # regarde plutot qu'ignore.
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      matrix:
        api-level: [30]
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          android: false
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Ensure gradle wrapper exists
        run: |
          if [ ! -f "./gradlew" ]; then
            curl -sL https://services.gradle.org/distributions/gradle-8.11.1-bin.zip -o /tmp/gradle.zip
            unzip -q /tmp/gradle.zip -d /tmp/gradle
            /tmp/gradle/gradle-8.11.1/bin/gradle wrapper --gradle-version 8.11.1 --distribution-type bin
            chmod +x ./gradlew
          fi

      # Images ATD (Automated Test Device) : variantes allegees concues pour la
      # CI. Moins de services systeme demarrent, donc la fenetre pendant laquelle
      # l'appareil repond a adb sans que le framework soit pret se reduit — c'est
      # exactement la course qui faisait echouer le job une fois sur quatre
      # (ServiceNotFoundException: No service published for: input, 10 s apres le
      # lancement, tres loin du timeout de 600 s).
      #
      # La cle de cache inclut la cible : un AVD google_apis en cache restaure
      # par-dessus une config aosp_atd donnerait un appareil incoherent.
      - name: AVD cache
        id: avd-cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-${{ matrix.api-level }}-aosp_atd

      - name: Create AVD & warm up
        if: steps.avd-cache.outputs.cache-hit != 'true'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          arch: x86_64
          target: aosp_atd
          force-avd-creation: false
          ram-size: 3072M
          heap-size: 384M
          disk-size: 6144M
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: echo "AVD ready"

      # continue-on-error sur cette etape seulement : on veut pouvoir enchainer
      # sur la seconde tentative. L'echec reste visible via son outcome.
      - name: Run instrumented tests
        id: instrumented
        continue-on-error: true
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          arch: x86_64
          target: aosp_atd
          force-avd-creation: false
          ram-size: 3072M
          heap-size: 384M
          disk-size: 6144M
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: ./gradlew :app:connectedDebugAndroidTest --no-daemon --stacktrace

      # Une course au demarrage rate rarement deux fois de suite. Une seconde
      # tentative distingue donc le hasard d'un vrai echec de test : si celle-ci
      # tombe aussi, le probleme n'est pas l'emulateur.
      - name: Retry instrumented tests
        if: steps.instrumented.outcome == 'failure'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          arch: x86_64
          target: aosp_atd
          force-avd-creation: true
          ram-size: 3072M
          heap-size: 384M
          disk-size: 6144M
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: ./gradlew :app:connectedDebugAndroidTest --no-daemon --stacktrace

      - name: Upload instrumented test reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: instrumented-test-reports-api${{ matrix.api-level }}
          path: |
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/

  # La publication est un job a part, qui depend des trois autres.
  #
  # Auparavant elle vivait dans `build`, sans aucun `needs` : l'APK partait en
  # release meme quand les tests echouaient, puisque les jobs sont paralleles et
  # que `build` ne consultait jamais leur resultat. Retirer continue-on-error du
  # job de tests rendait le run rouge, mais ne fermait pas cette porte.
  #
  # Les trois jobs restent paralleles : la release n'attend que le plus lent,
  # pas la somme. Mettre `needs` directement sur `build` aurait serialise le
  # build derriere les tests, ce qui aurait coute bien plus cher.
  #
  # Si les tests instrumentes sont sautes (push sur dev), ce job l'est aussi —
  # ce qui est le comportement voulu, on ne publie pas depuis dev.
  release:
    name: Publish release
    needs: [build, unit-tests, instrumented-tests]
    if: github.ref == 'refs/heads/main' || github.event.inputs.publish_release == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Download APK
        uses: actions/download-artifact@v4
        with:
          name: apk-${{ needs.build.outputs.tag }}

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.build.outputs.tag }}
          name: TrackMyWeight ${{ needs.build.outputs.tag }}
          body: |
            Debug build automatique, publie apres passage des tests.

            - Commit : ${{ github.sha }}
            - Date : ${{ needs.build.outputs.date }}
            - Build #${{ needs.build.outputs.build_num }}

            **Installation** : télécharge l'APK et installe depuis ton téléphone (autoriser les sources inconnues pour ton navigateur si besoin).
          files: ${{ needs.build.outputs.apk_name }}
          prerelease: true
          make_latest: true

      # Chaque build publie une prerelease : sans retention, elles s'accumulent
      # indefiniment (67 au moment d'ajouter cette etape, pour 10 reellement utiles).
      # On conserve les KEEP plus recentes et on supprime les autres avec leur tag.
      # continue-on-error : le menage ne doit jamais faire echouer une release.
      - name: Prune old prereleases
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          KEEP: 10
        run: |
          set -u
          gh release list --repo "$GITHUB_REPOSITORY" --limit 200 --json tagName,createdAt,isPrerelease > releases.json
          jq -r --argjson keep "$KEEP" 'map(select(.isPrerelease)) | sort_by(.createdAt) | reverse | .[$keep:][] | .tagName' releases.json > to-delete.txt
          echo "A supprimer : $(wc -l < to-delete.txt) prerelease(s), on garde les $KEEP plus recentes."
          while read -r tag; do
            [ -z "$tag" ] && continue
            echo "  suppression $tag"
            gh release delete "$tag" --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag || true
          done < to-delete.txt
